version: '3.8'

# Staging Docker Compose Override
# 
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  app:
    image: csat-platform:staging
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    mem_limit: 1g
    cpus: '1'
    mem_reservation: 512m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=csat,environment=staging"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/csat.iwn.ng.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html:ro

networks:
  csat-network:
    external: true
    name: csat-staging