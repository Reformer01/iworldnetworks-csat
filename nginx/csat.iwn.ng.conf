# CSAT Platform - Nginx Reverse Proxy Configuration
# Place at: /etc/nginx/sites-available/csat.iwn.ng
# Enable: ln -sf /etc/nginx/sites-available/csat.iwn.ng /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=feedback:10m rate=30r/m;

# Upstream Next.js application
upstream csat_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name csat.iwn.ng www.csat.iwn.ng;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csat.iwn.ng www.csat.iwn.ng;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/csat.iwn.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csat.iwn.ng/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL session optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers (additional to Next.js headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    
    # HSTS (1 year, include subdomains, preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Root directory for static files and ACME challenges
    root /home/csat.iwn.ng/csat/public;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ============================================================
    # RATE LIMITING
    # ============================================================
    
    # Webhook endpoint - stricter limits
    location = /api/splynx-webhook {
        limit_req zone=webhook burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://csat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support for any future needs
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Admin login - stricter limits
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://csat_backend;
        include proxy_params;
    }

    # Admin API routes
    location /api/admin/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://csat_backend;
        include proxy_params;
    }

    # Public API routes
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        
        proxy_pass http://csat_backend;
        include proxy_params;
    }

    # Feedback forms (public)
    location /feedback {
        limit_req zone=feedback burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://csat_backend;
        include proxy_params;
    }

    # ============================================================
    # STATIC ASSETS (Next.js)
    # ============================================================
    
    # Next.js static files - long-term caching
    location /_next/static/ {
        proxy_pass http://csat_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Next.js public assets
    location /public/ {
        proxy_pass http://csat_backend;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ============================================================
    # MAIN APPLICATION
    # ============================================================
    
    location / {
        proxy_pass http://csat_backend;
        include proxy_params;
        
        # WebSocket support for hot reload (dev) or future features
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache control for HTML (no cache)
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ============================================================
    # HEALTH CHECK (no rate limit, no auth)
    # ============================================================
    
    location = /api/health {
        access_log off;
        proxy_pass http://csat_backend;
        include proxy_params;
    }

    # ============================================================
    # ERROR PAGES
    # ============================================================
    
    error_page 429 /429.html;
    location = /429.html {
        root /home/csat.iwn.ng/csat/public;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /home/csat.iwn.ng/csat/public;
        internal;
    }

    # ============================================================
    # SECURITY: Block access to sensitive files
    # ============================================================
    
    location ~ /\.(env|git|svn) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================
# PROXY PARAMETERS (include in /etc/nginx/proxy_params or inline)
# ============================================================

