version: '3.8'

# Production Docker Compose Override
# 
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    # Use production image tag
    image: csat-platform:${IMAGE_TAG:-latest}
    
    # Deploy with multiple replicas for HA
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Production health checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Production resource limits
    mem_limit: 2g
    cpus: '2'
    mem_reservation: 1g

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=csat,environment=production"

  nginx:
    image: nginx:alpine
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # SSL volumes from Let's Encrypt
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/csat.iwn.ng.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html:ro

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=nginx,environment=production"

# External networks for production
networks:
  csat-network:
    external: true
    name: csat-production

