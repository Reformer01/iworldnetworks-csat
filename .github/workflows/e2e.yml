name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Staging origin (must contain "staging")'
        required: true
        default: 'https://staging.csat.iwn.ng'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (staging only)
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          E2E_SUPER_EMAIL: ${{ secrets.E2E_SUPER_EMAIL }}
          E2E_SUPER_PASSWORD: ${{ secrets.E2E_SUPER_PASSWORD }}
          E2E_EDITOR_EMAIL: ${{ secrets.E2E_EDITOR_EMAIL }}
          E2E_EDITOR_PASSWORD: ${{ secrets.E2E_EDITOR_PASSWORD }}
          MAILPIT_URL: ${{ secrets.MAILPIT_URL }}
          CI: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
